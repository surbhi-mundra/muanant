[project]
name = "sovereign"
version = "0.1.0"
description = "SOVEREIGN — On-Premise Agentic AI Workbench Using Open-Weight Multimodal LLMs for Confidential Industrial Work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SOVEREIGN Team" }]
keywords = ["ai", "rag", "agents", "on-premise", "multimodal", "industrial"]

# Runtime dependencies required for Phase 1 (foundation).
# Heavy ML stacks (torch, transformers, sentence-transformers) are intentionally
# NOT declared here — they belong to specific model-backend extras and are loaded
# only when the corresponding adapter is selected in configs/models.yaml.
# The dev sandbox runs on the MockBackend, which has zero ML deps.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "qdrant-client>=1.11",
    "httpx>=0.27",
    "tenacity>=8.5",
    "structlog>=24.4",
    "PyJWT>=2.9",
    "passlib[argon2]>=1.7",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "langgraph>=0.6",
]

[project.optional-dependencies]
# Phase 1 dev/CI tooling
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
]
# Real model backends (installed only on GPU tiers).
# Not used by the dev sandbox / CI.
backends-cpu = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    # torch CPU build is intentionally not pinned here — install via the
    # official CPU wheel index when needed.
]
backends-gpu = [
    "vllm>=0.6",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
]
ocr = [
    "pytesseract>=0.3.10",
    "surya-ocr>=0.8",
]

[project.urls]
Documentation = "https://github.com/sovereign/sovereign/blob/main/docs/architecture.md"

[project.scripts]
sovereign-admin = "sovereign.cli.__main__:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sovereign"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "workbench",       # Next.js project, separate toolchain
    "alembic/versions",# auto-generated migrations
    "skills",          # ambient skill files
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PL",       # pylint subset
    "PTH",      # use pathlib
    "ASYNC",    # async linting
    "S",        # bandit (security) — curated below
    "A",        # builtins shadowing
]
ignore = [
    "PLR0913",  # too many args — fine for typed constructors
    "PLR2004",  # magic values in tests — fine
    "S101",     # assert in tests — fine
    "S104",     # 0.0.0.0 binding — intentional in containers
    "B008",     # function call in default arg — FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S106", "S105", "PLC0415", "PLR0917"]  # test helpers, asserts, lazy imports
"sovereign/cli/**" = ["S603", "S607"]     # subprocess calls in CLI are explicit
"sovereign/parsing/**" = ["PLR0912", "PLR0915", "PLC0415"]  # parsers are inherently branchy
"sovereign/ingestion/**" = ["PLR0911", "PLR0912", "PLR0915", "PLC0415"]  # lazy imports for optional deps
"sovereign/ocr/**" = ["PLC0415"]  # lazy imports for OCR pipeline
"sovereign/api/routes/**" = ["PLC0415"]  # lazy imports in route handlers
"sovereign/rag/**" = ["PLR0912", "PLR0915", "PLC0415"]  # pipeline is inherently complex
"sovereign/agents/**" = ["PLC0415", "PLR0911"]  # lazy imports for optional deps, heuristic branches
"sovereign/orchestration/**" = ["PLC0415"]  # lazy imports in graph

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
exclude = [
    "workbench/",
    "alembic/versions/",
    "skills/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["fitz", "PIL.*", "pytesseract", "docx.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-p", "no:cacheprovider",
]
asyncio_mode = "auto"
markers = [
    "integration: integration tests (may use DB / network / disk)",
    "requires_gpu: tests that need a real GPU-backed model adapter",
    "slow: tests that take >1s",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["sovereign"]
omit = ["*/tests/*", "*/alembic/*", "sovereign/cli/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
