# SOVEREIGN Model Gateway configuration — Ollama (local inference)
#
# This file wires the ModelGateway to use Ollama for real local AI inference.
# Ollama works on Mac (Apple Silicon + Intel), Linux, and Windows.
#
# Setup:
#   1. Install Ollama: https://ollama.com
#   2. Start Ollama: ollama serve (or it auto-starts on Mac)
#   3. Pull models (see below)
#   4. Edit this file to select which models to use
#   5. Restart the API: make run

text:
  backend: ollama.text
  model_name: qwen2.5:7b-instruct
  server_url: http://127.0.0.1:11434
  # Lighter alternative (faster, less accurate):
  # model_name: qwen2.5:3b-instruct
  # Even lighter:
  # model_name: qwen2.5:1.5b-instruct

vision:
  backend: mock.vision
  model_name: mock-vision-llm
  # Ollama doesn't support vision models yet as of 2024.
  # For vision, use vLLM with Qwen2-VL on a GPU machine, or
  # use the mock backend (describes images with placeholder text).

embedding:
  backend: ollama.embedding
  model_name: nomic-embed-text
  server_url: http://127.0.0.1:11434
  dim: 768
  # Alternative embedding model:
  # model_name: all-MiniLM-L6-v2.gguf2.f16
  # dim: 384

reranker:
  backend: mock.reranker
  model_name: mock-reranker
  # Ollama doesn't have a dedicated reranker model.
  # For real reranking, use sentence-transformers with
  # BAAI/bge-reranker-v2-m3 on a GPU machine.

ocr:
  backend: tesseract.ocr
  model_name: tesseract-5.x
  languages: [eng]
