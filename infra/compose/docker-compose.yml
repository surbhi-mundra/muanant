# SOVEREIGN — Docker Compose for Tier 2 (single GPU workstation)
#
# Services:
#   - api: SOVEREIGN FastAPI backend
#   - workbench: Next.js frontend
#   - db: PostgreSQL
#   - qdrant: Qdrant vector database
#
# Usage:
#   docker compose -f infra/compose/docker-compose.yml up -d
#
# For Tier 1 (dev), see docker-compose.dev.yml

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: sovereign
      MONGO_INITDB_ROOT_PASSWORD: sovereign
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      SOVEREIGN_ENV: prod
      DATABASE_URL: mongodb://sovereign:sovereign@mongo:27017/sovereign?authSource=admin
      QDRANT_URL: http://qdrant:6333
      OBJECT_STORE_FS_ROOT: /var/lib/sovereign/objects
      EGRESS_ENABLED: "false"
      SOVEREIGN_JWT_SECRET: ${SOVEREIGN_JWT_SECRET:-change-me-in-prod}
    volumes:
      - sovereign_objects:/var/lib/sovereign/objects
    ports:
      - "8000:8000"
    restart: unless-stopped

  workbench:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.workbench
    depends_on:
      - api
    environment:
      SOVEREIGN_API_URL: http://api:8000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mongodata:
  qdrant_data:
  sovereign_objects:
